<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Trading en Tiempo Real</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a0033 0%, #330066 100%);
            color: #ffffff;
            min-height: 100vh;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            backdrop-filter: blur(10px);
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            background: linear-gradient(45deg, #ff6b9d, #c66cd4, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header .subtitle {
            color: #c084fc;
            font-size: 1.1em;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .control-group {
            background: rgba(255, 255, 255, 0.05);
            padding: 15px 25px;
            border-radius: 10px;
            backdrop-filter: blur(10px);
        }

        .control-group label {
            display: block;
            margin-bottom: 5px;
            color: #c084fc;
            font-weight: 600;
        }

        select, button {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            cursor: pointer;
            transition: all 0.3s;
        }

        select {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            min-width: 150px;
        }

        select:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        button {
            background: linear-gradient(45deg, #ff6b9d, #c66cd4);
            color: white;
            font-weight: 600;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 107, 157, 0.4);
        }

        .monitor-btn {
            width: 100%;
            margin-top: 10px;
            padding: 12px;
            font-size: 0.95em;
            background: linear-gradient(45deg, #8b5cf6, #6366f1);
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .monitor-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(139, 92, 246, 0.5);
        }

        .monitor-btn.active {
            background: linear-gradient(45deg, #f87171, #ef4444);
            animation: pulse 2s infinite;
        }

        .monitor-btn.active:hover {
            box-shadow: 0 5px 20px rgba(248, 113, 113, 0.5);
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.85; }
        }

        .status-bar {
            display: flex;
            justify-content: space-around;
            margin-bottom: 30px;
            padding: 15px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            backdrop-filter: blur(10px);
        }

        .status-item {
            text-align: center;
        }

        .status-label {
            color: #c084fc;
            font-size: 0.9em;
            margin-bottom: 5px;
        }

        .status-value {
            font-size: 1.3em;
            font-weight: 600;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
            max-width: 100%;
        }
        
        @media (min-width: 1400px) {
            .grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }
        
        @media (min-width: 1800px) {
            .grid {
                grid-template-columns: repeat(4, 1fr);
            }
        }

        .card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            padding: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(139, 92, 246, 0.3);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 2px solid rgba(255, 255, 255, 0.1);
        }

        .asset-name {
            font-size: 1.5em;
            font-weight: 700;
        }

        .asset-symbol {
            color: #c084fc;
            font-size: 0.9em;
        }

        .price-section {
            margin-bottom: 20px;
        }

        .current-price {
            font-size: 2em;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .price-change {
            font-size: 1.1em;
            padding: 5px 10px;
            border-radius: 5px;
            display: inline-block;
        }

        .positive {
            background: rgba(34, 197, 94, 0.2);
            color: #4ade80;
        }

        .negative {
            background: rgba(239, 68, 68, 0.2);
            color: #f87171;
        }

        .signal-section {
            margin-bottom: 20px;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
        }

        .signal-buy {
            background: rgba(34, 197, 94, 0.2);
            border: 2px solid #4ade80;
        }

        .signal-sell {
            background: rgba(239, 68, 68, 0.2);
            border: 2px solid #f87171;
        }

        .signal-hold {
            background: rgba(234, 179, 8, 0.2);
            border: 2px solid #fbbf24;
        }

        .signal-label {
            font-size: 1.8em;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .confidence-bar {
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            overflow: hidden;
            margin-top: 10px;
        }

        .confidence-fill {
            height: 100%;
            background: linear-gradient(90deg, #ff6b9d, #c66cd4);
            transition: width 0.5s;
        }

        .metrics {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 15px;
        }

        .metric {
            background: rgba(255, 255, 255, 0.05);
            padding: 10px;
            border-radius: 8px;
        }

        .metric-label {
            color: #c084fc;
            font-size: 0.85em;
            margin-bottom: 5px;
        }

        .metric-value {
            font-size: 1.1em;
            font-weight: 600;
        }

        .levels {
            display: flex;
            justify-content: space-between;
            gap: 10px;
        }

        .level-box {
            flex: 1;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
        }

        .support-box {
            background: rgba(34, 197, 94, 0.1);
            border: 1px solid #4ade80;
        }

        .resistance-box {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid #f87171;
        }

        .level-label {
            font-size: 0.8em;
            margin-bottom: 5px;
            opacity: 0.8;
        }

        .level-value {
            font-weight: 600;
        }

        .loading {
            text-align: center;
            padding: 40px;
            font-size: 1.2em;
            color: #c084fc;
        }

        .error {
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid #f87171;
            color: #f87171;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            margin: 20px 0;
        }

        .timestamp {
            text-align: center;
            color: #c084fc;
            font-size: 0.9em;
            margin-top: 20px;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .updating {
            animation: pulse 1.5s ease-in-out infinite;
        }

        @media (max-width: 768px) {
            .grid {
                grid-template-columns: 1fr;
            }
            
            .controls {
                flex-direction: column;
            }
            
            .status-bar {
                flex-direction: column;
                gap: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🚀 Dashboard Trading en Tiempo Real</h1>
        <p class="subtitle">Análisis automático con señales de compra/venta</p>
    </div>

    <div class="controls">
        <div class="control-group">
            <label for="categorySelect">📂 Categoría</label>
            <select id="categorySelect" onchange="onCategoryChange()">
                <option value="all">📊 Todas (Mix)</option>
                <option value="crypto">💰 Criptomonedas (20)</option>
                <option value="stocks">📈 Acciones (20)</option>
                <option value="forex">💱 Divisas (20)</option>
                <option value="indices">📉 Índices (20)</option>
                <option value="commodities">🥇 Commodities (20)</option>
            </select>
        </div>
        <div class="control-group">
            <label for="intervalSelect">⏱️ Intervalo de Tiempo</label>
            <select id="intervalSelect">
                <option value="1m">1 Minuto (Scalping)</option>
                <option value="5m" selected>5 Minutos</option>
                <option value="15m">15 Minutos</option>
                <option value="1h">1 Hora</option>
            </select>
        </div>
        <div class="control-group">
            <button onclick="updateDashboard()">🔄 Actualizar Ahora</button>
        </div>
        <div class="control-group">
            <button onclick="toggleAutoRefresh()" id="autoRefreshBtn">⏸️ Pausar Auto-Refresh</button>
        </div>
    </div>

    <div class="status-bar">
        <div class="status-item">
            <div class="status-label">🔴 Estado</div>
            <div class="status-value" id="statusValue">En Vivo</div>
        </div>
        <div class="status-item">
            <div class="status-label">⏰ Última Actualización</div>
            <div class="status-value" id="lastUpdate">--:--:--</div>
        </div>
        <div class="status-item">
            <div class="status-label">📊 Activos</div>
            <div class="status-value" id="assetsCount">0</div>
        </div>
        <div class="status-item">
            <div class="status-label">🎯 Señales Activas</div>
            <div class="status-value" id="signalsCount">0</div>
        </div>
    </div>

    <div id="dashboard" class="grid">
        <div class="loading">⏳ Cargando datos en tiempo real...</div>
    </div>

    <div class="timestamp" id="timestamp"></div>

    <script>
        let autoRefresh = true;
        let refreshInterval = null;
        const REFRESH_RATE = 5000; // 5 segundos
        let monitoredAssets = new Set(); // Track monitored assets

        function formatPrice(price) {
            return '$' + price.toLocaleString('en-US', {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            });
        }

        function formatPercent(value) {
            const sign = value >= 0 ? '+' : '';
            return sign + value.toFixed(2) + '%';
        }

        function getSignalColor(signal) {
            if (signal === 'BUY') return 'signal-buy';
            if (signal === 'SELL') return 'signal-sell';
            return 'signal-hold';
        }

        function getSignalEmoji(signal) {
            if (signal === 'BUY') return '📈';
            if (signal === 'SELL') return '📉';
            return '⏸️';
        }

        async function toggleMonitor(symbol, interval) {
            const btn = document.getElementById(`monitor-btn-${symbol}`);
            const isMonitored = monitoredAssets.has(symbol);
            
            try {
                if (isMonitored) {
                    // Detener monitoreo
                    const response = await fetch('/api/auto-monitor/stop', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ symbol })
                    });
                    
                    const data = await response.json();
                    if (data.success) {
                        monitoredAssets.delete(symbol);
                        btn.classList.remove('active');
                        btn.innerHTML = '📲 Activar Notificaciones (cada 1 min)';
                        showNotification(`✅ Notificaciones detenidas para ${symbol}`, 'success');
                    }
                } else {
                    // Iniciar monitoreo
                    const response = await fetch('/api/auto-monitor/start', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ symbol, interval })
                    });
                    
                    const data = await response.json();
                    if (data.success) {
                        monitoredAssets.add(symbol);
                        btn.classList.add('active');
                        btn.innerHTML = '🔔 Detener Notificaciones';
                        showNotification(`✅ Notificaciones activadas para ${symbol} - Recibirás alertas cada 60 segundos`, 'success');
                    }
                }
            } catch (error) {
                console.error('Error toggling monitor:', error);
                showNotification(`❌ Error al cambiar monitoreo de ${symbol}`, 'error');
            }
        }

        async function loadMonitorStatus() {
            try {
                const response = await fetch('/api/auto-monitor/status');
                const data = await response.json();
                
                if (data.monitored_assets) {
                    Object.keys(data.monitored_assets).forEach(symbol => {
                        monitoredAssets.add(symbol);
                    });
                }
            } catch (error) {
                console.error('Error loading monitor status:', error);
            }
        }

        function showNotification(message, type = 'info') {
            const notification = document.createElement('div');
            notification.style.cssText = `
                position: fixed;
                top: 20px;
                right: 20px;
                padding: 15px 25px;
                background: ${type === 'success' ? 'rgba(34, 197, 94, 0.95)' : 'rgba(239, 68, 68, 0.95)'};
                color: white;
                border-radius: 10px;
                font-weight: 600;
                z-index: 10000;
                box-shadow: 0 5px 20px rgba(0,0,0,0.3);
            `;
            notification.textContent = message;
            document.body.appendChild(notification);
            
            setTimeout(() => {
                notification.remove();
            }, 3000);
        }

        function createAssetCard(asset) {
            const changeClass = asset.change_24h >= 0 ? 'positive' : 'negative';
            const signalClass = getSignalColor(asset.signal);
            const signalEmoji = getSignalEmoji(asset.signal);
            
            // Crear lista de razones
            const reasonsList = asset.reasons && asset.reasons.length > 0 
                ? asset.reasons.slice(0, 3).map(r => `<li>${r}</li>`).join('')
                : '<li>Sin razones específicas</li>';
            
            // Determinar emoji y color del patrón
            const getPatternInfo = (pattern) => {
                const patterns = {
                    'Hammer': { emoji: '🔨', color: '#4ade80', type: 'ALCISTA' },
                    'Shooting Star': { emoji: '⭐', color: '#f87171', type: 'BAJISTA' },
                    'Doji': { emoji: '🎯', color: '#fbbf24', type: 'NEUTRAL' },
                    'Bullish Engulfing': { emoji: '📈', color: '#4ade80', type: 'ALCISTA' },
                    'Bearish Engulfing': { emoji: '📉', color: '#f87171', type: 'BAJISTA' },
                    'Morning Star': { emoji: '🌅', color: '#4ade80', type: 'ALCISTA' },
                    'Evening Star': { emoji: '🌆', color: '#f87171', type: 'BAJISTA' },
                    'Three White Soldiers': { emoji: '⚪⚪⚪', color: '#4ade80', type: 'ALCISTA' },
                    'Three Black Crows': { emoji: '⚫⚫⚫', color: '#f87171', type: 'BAJISTA' },
                };
                return patterns[pattern] || { emoji: '📊', color: '#c084fc', type: 'SIN PATRÓN' };
            };
            
            const patternInfo = getPatternInfo(asset.pattern);
            
            return `
                <div class="card">
                    <div class="card-header">
                        <div>
                            <div class="asset-name">${asset.name}</div>
                            <div class="asset-symbol">${asset.symbol}</div>
                            <div style="font-size: 0.75em; color: #8b5cf6; margin-top: 3px;">
                                ${asset.asset_type ? asset.asset_type.toUpperCase() : ''} • 
                                ${asset.data_source ? asset.data_source.replace('_', ' ').toUpperCase() : ''}
                                ${asset.data_source && asset.data_source.includes('binomo') ? ' 🟣' : ''}
                            </div>
                        </div>
                        <div class="asset-symbol">${asset.interval}</div>
                    </div>
                    
                    ${asset.pattern && asset.pattern !== 'No Pattern' ? `
                    <div style="margin: 10px 0; padding: 10px; background: rgba(255,255,255,0.05); border-left: 3px solid ${patternInfo.color}; border-radius: 5px;">
                        <div style="display: flex; align-items: center; gap: 8px;">
                            <span style="font-size: 1.3em;">${patternInfo.emoji}</span>
                            <div style="flex: 1;">
                                <div style="font-weight: 600; font-size: 0.95em;">${asset.pattern}</div>
                                <div style="font-size: 0.8em; color: ${patternInfo.color}; font-weight: 600;">
                                    Patrón ${patternInfo.type}
                                </div>
                            </div>
                        </div>
                    </div>
                    ` : ''}
                    
                    <div class="price-section">
                        <div class="current-price">${formatPrice(asset.price)}</div>
                        <div class="price-change ${changeClass}">
                            ${formatPercent(asset.change_24h)} 24h
                        </div>
                    </div>
                    
                    <div class="signal-section ${signalClass}">
                        <div class="signal-label">${signalEmoji} ${asset.signal}</div>
                        <div style="margin: 5px 0; font-weight: 600;">
                            ${asset.signal === 'BUY' ? '📈 Comprar en Entorno Alcista' : 
                              asset.signal === 'SELL' ? '📉 Vender en Entorno Bajista' : 
                              '⏸️ Esperar - Sin Señal Clara'}
                        </div>
                        <div style="margin: 5px 0; font-size: 0.95em;">
                            Confianza: ${asset.confidence.toFixed(0)}% • 
                            Tipo: ${asset.trend || 'NEUTRAL'}
                        </div>
                        ${asset.bounce_probability > 0 ? 
                            `<div style="font-size: 0.9em; opacity: 0.9;">Prob. Rebote: ${asset.bounce_probability.toFixed(0)}%</div>` : ''}
                        <div class="confidence-bar">
                            <div class="confidence-fill" style="width: ${asset.confidence}%"></div>
                        </div>
                        ${asset.confidence >= 60 && asset.signal !== 'HOLD' ? 
                            `<div style="margin-top: 8px; padding: 8px; background: rgba(255,255,255,0.1); border-radius: 5px; font-size: 0.9em; font-weight: 600;">
                                ✅ Señal válida - Recomendado ${asset.signal === 'BUY' ? 'COMPRAR' : 'VENDER'}
                            </div>` : 
                            `<div style="margin-top: 8px; padding: 8px; background: rgba(255,255,255,0.05); border-radius: 5px; font-size: 0.85em;">
                                ⚠️ Confianza baja - No operar
                            </div>`
                        }
                    </div>
                    
                    <div style="margin: 15px 0; padding: 12px; background: ${
                        asset.trend === 'BULLISH' ? 'rgba(34, 197, 94, 0.15)' : 
                        asset.trend === 'BEARISH' ? 'rgba(239, 68, 68, 0.15)' : 
                        'rgba(234, 179, 8, 0.15)'
                    }; border-radius: 8px; border-left: 4px solid ${
                        asset.trend === 'BULLISH' ? '#4ade80' : 
                        asset.trend === 'BEARISH' ? '#f87171' : 
                        '#fbbf24'
                    };">
                        <div style="font-weight: 600; margin-bottom: 5px;">
                            ${asset.trend === 'BULLISH' ? '📈 Mercado Alcista' : 
                              asset.trend === 'BEARISH' ? '📉 Mercado Bajista' : 
                              '➡️ Mercado Neutral'}
                        </div>
                        <div style="font-size: 0.9em; opacity: 0.95;">
                            ${asset.trend === 'BULLISH' ? 'Buscar oportunidades de COMPRA en retrocesos' : 
                              asset.trend === 'BEARISH' ? 'Buscar oportunidades de VENTA en rebotes' : 
                              'Esperar confirmación de dirección'}
                        </div>
                    </div>
                    
                    <div class="metrics">
                        <div class="metric">
                            <div class="metric-label">🎯 Take Profit</div>
                            <div class="metric-value">${formatPrice(asset.take_profit)}</div>
                        </div>
                        <div class="metric">
                            <div class="metric-label">🛑 Stop Loss</div>
                            <div class="metric-value">${formatPrice(asset.stop_loss)}</div>
                        </div>
                        <div class="metric">
                            <div class="metric-label">⚖️ Risk/Reward</div>
                            <div class="metric-value">${asset.risk_reward.toFixed(2)}:1</div>
                        </div>
                        <div class="metric">
                            <div class="metric-label">📊 Tipo Tendencia</div>
                            <div class="metric-value">${asset.trend}</div>
                        </div>
                        <div class="metric">
                            <div class="metric-label">🎭 Patrón</div>
                            <div class="metric-value" style="font-size: 0.85em;">${asset.pattern || 'Ninguno'}</div>
                        </div>
                        <div class="metric">
                            <div class="metric-label">📈 Volatilidad</div>
                            <div class="metric-value">${asset.volatility}</div>
                        </div>
                        <div class="metric">
                            <div class="metric-label">💪 Volumen</div>
                            <div class="metric-value">${asset.volume_status}</div>
                        </div>
                        <div class="metric">
                            <div class="metric-label">🎯 Éxito Hist.</div>
                            <div class="metric-value">${asset.historical_success_rate.toFixed(0)}%</div>
                        </div>
                    </div>
                    
                    <div style="margin: 15px 0; padding: 10px; background: rgba(255,255,255,0.05); border-radius: 8px;">
                        <div style="font-size: 0.9em; color: #c084fc; margin-bottom: 5px;">🧠 Psicología del Mercado</div>
                        <div style="font-weight: 600; margin-bottom: 5px;">${asset.sentiment}</div>
                        <div style="font-size: 0.85em; opacity: 0.9;">${asset.psychology_desc}</div>
                    </div>
                    
                    <div style="margin: 15px 0; padding: 10px; background: rgba(255,255,255,0.05); border-radius: 8px;">
                        <div style="font-size: 0.9em; color: #c084fc; margin-bottom: 8px;">📝 Razones de la Señal</div>
                        <ul style="margin: 0; padding-left: 20px; font-size: 0.85em; line-height: 1.6;">
                            ${reasonsList}
                        </ul>
                    </div>
                    
                    <div class="levels">
                        <div class="level-box support-box">
                            <div class="level-label">🟢 Soporte</div>
                            <div class="level-value">${asset.key_levels.support.length > 0 ? formatPrice(asset.key_levels.support[0]) : 'N/A'}</div>
                        </div>
                        <div class="level-box resistance-box">
                            <div class="level-label">🔴 Resistencia</div>
                            <div class="level-value">${asset.key_levels.resistance.length > 0 ? formatPrice(asset.key_levels.resistance[0]) : 'N/A'}</div>
                        </div>
                    </div>
                    
                    <button class="monitor-btn ${monitoredAssets.has(asset.symbol) ? 'active' : ''}" 
                            onclick="toggleMonitor('${asset.symbol}', '${asset.interval}')"
                            id="monitor-btn-${asset.symbol}">
                        ${monitoredAssets.has(asset.symbol) ? 
                            '🔔 Detener Notificaciones' : 
                            '📲 Activar Notificaciones (cada 1 min)'}
                    </button>
                </div>
            `;
        }

        async function updateDashboard() {
            const dashboard = document.getElementById('dashboard');
            const interval = document.getElementById('intervalSelect').value;
            const category = document.getElementById('categorySelect').value;
            
            // Mostrar indicador de actualización
            document.getElementById('statusValue').classList.add('updating');
            
            try {
                let response, data;
                
                if (category === 'all') {
                    // Obtener mix de activos predeterminados
                    response = await fetch(`/api/analyze-all?interval=${interval}`);
                    data = await response.json();
                } else {
                    // Obtener activos de categoría específica
                    response = await fetch(`/api/analyze-category/${category}?interval=${interval}`);
                    data = await response.json();
                }
                
                if (data.assets && data.assets.length > 0) {
                    dashboard.innerHTML = data.assets.map(createAssetCard).join('');
                    
                    // Actualizar estadísticas
                    document.getElementById('assetsCount').textContent = data.assets.length;
                    
                    const activeSignals = data.assets.filter(a => 
                        a.signal !== 'HOLD' && a.confidence >= 60
                    ).length;
                    document.getElementById('signalsCount').textContent = activeSignals;
                    
                    // Actualizar timestamp
                    const now = new Date();
                    document.getElementById('lastUpdate').textContent = 
                        now.toLocaleTimeString('es-ES');
                    document.getElementById('timestamp').textContent = 
                        `Última actualización: ${now.toLocaleString('es-ES')}`;
                } else {
                    dashboard.innerHTML = '<div class="error">❌ No se pudieron obtener datos</div>';
                }
            } catch (error) {
                console.error('Error:', error);
                dashboard.innerHTML = '<div class="error">❌ Error al conectar con el servidor</div>';
            }
            
            document.getElementById('statusValue').classList.remove('updating');
        }
        
        function onCategoryChange() {
            updateDashboard();
        }

        function toggleAutoRefresh() {
            autoRefresh = !autoRefresh;
            const btn = document.getElementById('autoRefreshBtn');
            
            if (autoRefresh) {
                btn.textContent = '⏸️ Pausar Auto-Refresh';
                startAutoRefresh();
            } else {
                btn.textContent = '▶️ Reanudar Auto-Refresh';
                if (refreshInterval) {
                    clearInterval(refreshInterval);
                    refreshInterval = null;
                }
            }
        }

        function startAutoRefresh() {
            if (refreshInterval) {
                clearInterval(refreshInterval);
            }
            refreshInterval = setInterval(() => {
                if (autoRefresh) {
                    updateDashboard();
                }
            }, REFRESH_RATE);
        }

        // Event listeners
        document.getElementById('intervalSelect').addEventListener('change', updateDashboard);
        document.getElementById('categorySelect').addEventListener('change', updateDashboard);

        // Inicializar dashboard
        loadMonitorStatus(); // Cargar estado de monitoreo
        updateDashboard();
        startAutoRefresh();

        // Cleanup al cerrar
        window.addEventListener('beforeunload', () => {
            if (refreshInterval) {
                clearInterval(refreshInterval);
            }
        });
    </script>
</body>
</html>
